name: StyleOS 864 preliminary restricted kernel endurance
on:
  push:
    branches: [feature/styleos-kernel-stress-864, feature/styleos-kernel-integration-864-final]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install real guest tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Thirty-two independently verified mixed process batches on one real ISO boot
        run: python3 tools/test_desktop_autonomous_863.py --preview --rounds 32 --output build/s864-endurance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-preliminary-endurance
          path: build/s864-endurance/
          if-no-files-found: warn

  mixed-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install real guest tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools
      - name: Eight same-image cold save and reboot pairs with mixed CPL3 runtime
        run: python3 tools/test_desktop_storage_stability_863.py --mixed --output build/s864-mixed-storage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-mixed-storage
          path: build/s864-mixed-storage/
          if-no-files-found: warn

  wide-scheduler-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Thirty-two slot existing scheduler and bank lifecycle (host only)
        run: |
          set -euo pipefail
          mkdir -p build/s864-wide
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -ffunction-sections -fdata-sections -Wl,--gc-sections -DSTYLEOS_TEST_WIDE_SCHEDULER_864 -DSTYLEOS_TEST_RUNTIME_TICK_860 -DSTYLEOS_TEST_RUNTIME_SYSCALL_863 -Iinclude kernel/runtime_bank_862.c tests/test_runtime_wide_864.c kernel/{desktop_process_runtime,process_scheduler,process_runtime,window_service,runtime_tick_860,process_entry_847,user_copy_772}.c -o "build/s864-wide/$cc"
            "build/s864-wide/$cc" | tee "build/s864-wide/$cc.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-wide-host
          path: build/s864-wide/
          if-no-files-found: warn

  four-root-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Four detached address spaces with original builder and physical arena
        run: |
          set -euo pipefail
          mkdir -p build/s864-roots
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -DSTYLEOS_TEST_WIDE_ROOTS_864 -Iinclude kernel/{user_root_846,paging,apic_root_842,cache_policy_800,physical_arena_844}.c tests/test_user_roots_wide_864.c -o "build/s864-roots/$cc"
            "build/s864-roots/$cc" | tee "build/s864-roots/$cc.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-four-roots-host
          path: build/s864-roots/

  four-fx-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Four distinct FP contexts with generation-bound admission
        run: |
          set -euo pipefail
          mkdir -p build/s864-fx
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -DSTYLEOS_TEST_WIDE_FX_864 -Iinclude kernel/fx_context_849.c tests/test_fx_wide_864.c arch/x86_64/fx_context_849_host.S -o "build/s864-fx/$cc"
            "build/s864-fx/$cc" | tee "build/s864-fx/$cc.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-four-fx-host
          path: build/s864-fx/

  four-joint-roots:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Joint Desktop and four user roots with GOP isolation
        run: |
          set -euo pipefail
          mkdir -p build/s864-joint
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -DSTYLEOS_TEST_WIDE_ROOTS_864 -Iinclude kernel/{runtime_roots_861,user_root_846,desktop_root_850,desktop_gop_850,desktop_display,pci_aperture_795,cache_policy_800,cache_pagewalk_801,apic_root_842,paging,physical_arena_844}.c tests/test_runtime_roots_wide_864.c -o "build/s864-joint/$cc"
            "build/s864-joint/$cc" | tee "build/s864-joint/$cc.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-joint-roots-host
          path: build/s864-joint/

  four-real-cpl3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install guest build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools
      - name: Extended user fault-frame admission (GCC and Clang)
        run: |
          set -euo pipefail
          mkdir -p build/s864-four-fault-host
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -ffunction-sections -Wl,--gc-sections -DSTYLEOS_TEST_FOUR_GUEST_864 -Iinclude kernel/process_entry_847.c tests/test_fault_entry_wide_864.c -o "build/s864-four-fault-host/$cc"
            "build/s864-four-fault-host/$cc" | tee "build/s864-four-fault-host/$cc.log"
          done
      - name: Four independent actual CPL3 workloads and full CPU trace
        run: python3 tools/test_runtime_mixed_863_guest.py --four --output build/s864-four-real
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-four-real
          path: build/s864-four-real/
          if-no-files-found: warn

  four-live-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install real ISO guest tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Cold ISO with four live tasks and per-poll safe returns
        run: python3 tools/test_desktop_autonomous_863.py --preview --four --output build/s864-four-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-four-live-desktop
          path: build/s864-four-live/
          if-no-files-found: warn

  four-live-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install guest build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools
      - name: Eight independent four-process save and reboot pairs
        run: python3 tools/test_desktop_storage_stability_863.py --mixed --four --output build/s864-four-storage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-four-storage
          path: build/s864-four-storage/
          if-no-files-found: warn

  ordinary-desktop-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ordinary ISO guest tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Shared service lifecycle on default and wide scheduler configurations
        run: |
          set -euo pipefail
          mkdir -p build/s864-ordinary/host
          for cc in gcc clang; do
            for profile in default wide; do
              opts=()
              if [ "$profile" = wide ]; then opts+=(-DSTYLEOS_TEST_WIDE_SCHEDULER_864); fi
              "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -ffunction-sections -fdata-sections -Wl,--gc-sections "${opts[@]}" -Iinclude tests/test_runtime_bootstrap_863.c kernel/{runtime_entry_858,desktop_process_runtime,process_scheduler,process_runtime,window_service,user_session_runtime,native_window_channel}.c -o "build/s864-ordinary/host/$cc-$profile"
              for mode in ordinary owned dpr usr ipc pid-counter serial window-counter compositor unused-row unused-window dead-process; do
                "build/s864-ordinary/host/$cc-$profile" "$mode"
              done | tee "build/s864-ordinary/host/$cc-$profile.log"
            done
          done
      - name: Ordinary Desktop without diagnostic hardware grants
        run: |
          set -euo pipefail
          python3 tools/build.py --arch x86_64 --desktop-v0 --output build/s864-ordinary/compiler
          python3 tools/make_desktop_iso.py --efi build/s864-ordinary/compiler/x86_64/BOOTX64.EFI --output build/s864-ordinary/StyleOS-ordinary.iso
          xorriso -osirrox on -indev build/s864-ordinary/StyleOS-ordinary.iso -extract /EFI/BOOT/BOOTX64.EFI build/s864-ordinary/extracted.efi
          cmp build/s864-ordinary/extracted.efi build/s864-ordinary/compiler/x86_64/BOOTX64.EFI
          python3 tools/test_desktop_v0.py --boot build/s864-ordinary/StyleOS-ordinary.iso --output build/s864-ordinary/qemu
          python3 tools/test_runtime_bootstrap_863_verify.py --efi build/s864-ordinary/compiler/x86_64/BOOTX64.EFI --map build/s864-ordinary/compiler/x86_64/kernel.map --guest build/s864-ordinary/qemu --iso build/s864-ordinary/StyleOS-ordinary.iso --output build/s864-ordinary/bootstrap.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-ordinary-desktop
          path: build/s864-ordinary/
          if-no-files-found: warn


  four-live-repeatable:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install real ISO guest tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Eight independent live four-process launches on one boot
        run: python3 tools/test_desktop_autonomous_863.py --preview --four --rounds 8 --output build/s864-four-repeatable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-four-repeatable
          path: build/s864-four-repeatable/
          if-no-files-found: warn


  four-optical-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install optical guest tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Exact old and optical BAR policy with refusal cases
        run: |
          mkdir -p build/s864-four-optical-bar
          for cc in gcc clang; do
            "$cc" -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iinclude tests/test_busmaster_857.c -o "build/s864-four-optical-bar/$cc"
            "build/s864-four-optical-bar/$cc"
          done
      - name: Storage request budget and sticky refusal regression
        run: |
          mkdir -p build/s864-storage-budget-host
          for cc in gcc clang; do
            "$cc" -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iinclude kernel/storage_runtime_863.c tests/test_storage_runtime_863.c -o "build/s864-storage-budget-host/$cc"
            "build/s864-storage-budget-host/$cc"
          done
      - name: Real optical boot, four native contexts, guarded save and cold reopen
        run: python3 tools/test_desktop_storage_service_863.py --tasks --mixed --four --iso --output build/s864-four-optical-storage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-four-optical-storage
          path: build/s864-four-optical-storage/
          if-no-files-found: warn


  four-provisioned-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install optical guest tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Provisioned ISO without keyboard admission, save and reopen, foreign serial refusal
        run: python3 tools/test_desktop_storage_service_863.py --tasks --mixed --four --iso --provisioned --output build/s864-four-provisioned-storage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-four-provisioned-storage
          path: build/s864-four-provisioned-storage/
          if-no-files-found: warn


  integrated-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install optical guest tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Integrated ISO, ordinary save and eight uninterrupted native workload rounds on both boots
        run: python3 tools/test_desktop_storage_service_863.py --tasks --mixed --four --iso --provisioned --integrated --output build/s864-integrated-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-integrated-desktop
          path: build/s864-integrated-desktop/
          if-no-files-found: warn


  owned-shell-no-fixture-launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install optical guest tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Owned-root shell without test keyboard workload, real save and reboot
        run: python3 tools/test_desktop_storage_service_863.py --tasks --mixed --four --iso --provisioned --integrated --owned-shell --output build/s865-owned-shell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-865-owned-shell
          path: build/s865-owned-shell/
          if-no-files-found: warn


  entry-classification-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Workload-independent raw frame classification (host only)
        run: |
          set -euo pipefail
          mkdir -p build/s865-entry-classification
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -ffunction-sections -fdata-sections -Wl,--gc-sections -DSTYLEOS_TEST_RUNTIME_ENTRY_CLASSIFIER_865 -DSTYLEOS_TEST_FOUR_GUEST_864 -Iinclude kernel/process_entry_847.c tests/test_entry_classification_865.c -o "build/s865-entry-classification/$cc"
            "build/s865-entry-classification/$cc" | tee "build/s865-entry-classification/$cc.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-865-entry-classification
          path: build/s865-entry-classification/
          if-no-files-found: error


  image-admission-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Loader metadata admission and atomic refusal (host only)
        run: |
          set -euo pipefail
          mkdir -p build/s865-image-admission
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -ffunction-sections -fdata-sections -Wl,--gc-sections -DSTYLEOS_TEST_RUNTIME_IMAGE_ADMISSION_865 -DSTYLEOS_TEST_WIDE_ROOTS_864 -DSTYLEOS_TEST_FOUR_GUEST_864 -DSTYLEOS_TEST_RUNTIME_TICK_860 -DSTYLEOS_TEST_RUNTIME_SYSCALL_863 -Iinclude kernel/runtime_bank_862.c tests/test_image_admission_865.c kernel/{desktop_process_runtime,process_scheduler,process_runtime,window_service,runtime_tick_860,process_entry_847,user_copy_772}.c -o "build/s865-image-admission/$cc"
            "build/s865-image-admission/$cc" | tee "build/s865-image-admission/$cc.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-865-image-admission
          path: build/s865-image-admission/
          if-no-files-found: error
