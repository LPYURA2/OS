name: StyleOS 864 preliminary restricted kernel endurance
on:
  push:
    branches: [feature/styleos-kernel-stress-864]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install real guest tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Thirty-two independently verified mixed process batches on one real ISO boot
        run: python3 tools/test_desktop_autonomous_863.py --preview --rounds 32 --output build/s864-endurance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-preliminary-endurance
          path: build/s864-endurance/
          if-no-files-found: warn

  mixed-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install real guest tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools
      - name: Eight same-image cold save and reboot pairs with mixed CPL3 runtime
        run: python3 tools/test_desktop_storage_stability_863.py --mixed --output build/s864-mixed-storage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-mixed-storage
          path: build/s864-mixed-storage/
          if-no-files-found: warn

  wide-scheduler-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Thirty-two slot existing scheduler and bank lifecycle (host only)
        run: |
          set -euo pipefail
          mkdir -p build/s864-wide
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -ffunction-sections -fdata-sections -Wl,--gc-sections -DSTYLEOS_TEST_WIDE_SCHEDULER_864 -DSTYLEOS_TEST_RUNTIME_TICK_860 -DSTYLEOS_TEST_RUNTIME_SYSCALL_863 -Iinclude kernel/runtime_bank_862.c tests/test_runtime_wide_864.c kernel/{desktop_process_runtime,process_scheduler,process_runtime,window_service,runtime_tick_860,process_entry_847,user_copy_772}.c -o "build/s864-wide/$cc"
            "build/s864-wide/$cc" | tee "build/s864-wide/$cc.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-864-wide-host
          path: build/s864-wide/
          if-no-files-found: warn
