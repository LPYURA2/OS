name: StyleOS Explorer volume wire 117
on:
  push:
    branches: [feature/styleos-explorer-117, feature/styleos-explorer-118, feature/styleos-explorer-120, feature/styleos-explorer-121, feature/styleos-explorer-122, feature/styleos-explorer-124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explorer-volume-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify diagnostic packages fit existing native executable bounds
        run: |
          set -euo pipefail
          mkdir -p build/explorer-118/probe92
          PYTHONPATH=tools python3 -c 'from pathlib import Path; from build_native_sample_69 import build; build(Path("build/explorer-118/probe92"),file_probe_92=True)'
      - name: Actual mounted StyleFS metadata GCC and Clang
        run: |
          set -euo pipefail
          mkdir -p build/explorer-117
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -DSTYLEFS_HOST_FORMAT -DSTYLEOS_EXPLORER_115_TEST -DSTYLEOS_EXPLORER_116_TEST -DSTYLEOS_EXPLORER_117_TEST -fsanitize=address,undefined -fno-pie -no-pie -Iinclude -Isdk/native/include tests/test_stylefs_paged_volume64.c kernel/{stylefs_paged_volume64,stylefs_paged_object64,stylefs_paged_stream64,stylefs_paged_pair64,stylefs_inode_root64,stylefs_inode_pages64,stylefs_namespace64,stylefs_dircommit64,stylefs_directory64,stylefs_alloc64,stylefs_map64,stylefs_extent64,block_service,explorer_volume_115}.c -o "build/explorer-117/$cc"
            "build/explorer-117/$cc" | tee "build/explorer-117/$cc.log"
            grep -F 'EXPLORER115 actual volume geometry, empty list, remount and detach PASS' "build/explorer-117/$cc.log"
            grep -F 'EXPLORER116 actual free sectors, retained snapshot protection, readonly and stale refusal PASS' "build/explorer-117/$cc.log"
            grep -F 'EXPLORER117 real volume wire and SDK decoder PASS' "build/explorer-117/$cc.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explorer-volume-117
          path: build/explorer-117/*.log
