name: StyleOS independent native fault containment audit
on:
  push:
    branches: [feature/styleos-kernel-fault-containment-audit, feature/styleos-kernel-reacceptance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fault-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        probe: [divide, execute-nx, single-step, forbidden-int]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install actual guest tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Verify exact QEMU version
        run: qemu-system-x86_64 --version | head -n1 | grep '^QEMU emulator version 8\.2\.2 '
      - name: NX trace parser positive and negative contract
        run: python3 tools/test_native_nx_trace.py
      - name: Independent external ELF fault probe
        run: python3 tools/test_desktop_storage_service_863.py --tasks --mixed --four --iso --provisioned --integrated --owned-shell --native-catalog --native-fault-probe ${{ matrix.probe }} --output build/fault-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-fault-${{ matrix.probe }}
          path: build/fault-probe/
          if-no-files-found: warn
