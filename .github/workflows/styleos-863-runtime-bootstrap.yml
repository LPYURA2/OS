name: StyleOS 863 shared ordinary and owned-root bootstrap
on:
  push:
    branches: [feature/styleos-desktop-runtime-863]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Cold-start contract and sticky refusals on GCC and Clang
        run: |
          set -euo pipefail
          mkdir -p build/s863-host
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -ffunction-sections -fdata-sections -Wl,--gc-sections -Iinclude tests/test_runtime_bootstrap_863.c kernel/{runtime_entry_858,desktop_process_runtime,process_scheduler,process_runtime,window_service,user_session_runtime,native_window_channel}.c -o "build/s863-host/$cc"
            for mode in ordinary owned dpr usr ipc pid-counter serial window-counter compositor unused-row unused-window dead-process; do
              "build/s863-host/$cc" "$mode"
            done | tee "build/s863-host/$cc.log"
          done
      - name: Runtime RTC admission, loss of authority and restoration contract
        run: |
          set -euo pipefail
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iinclude tests/test_rtc_runtime_863.c kernel/{rtc_runtime_863,rtc_owner_854,rtc_cmos_854,rtc_acquire,rtc_decode}.c -o "build/s863-host/rtc-$cc"
            "build/s863-host/rtc-$cc" | tee "build/s863-host/rtc-$cc.log"
          done
          clang --target=x86_64-w64-windows-gnu -std=c11 -O2 -Wall -Wextra -Werror -ffreestanding -fno-stack-protector -mno-red-zone -Iinclude -c kernel/rtc_runtime_863.c -o build/s863-host/rtc-runtime.obj
      - name: Bounded storage admission, verified commit and sticky quarantine
        run: |
          set -euo pipefail
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iinclude tests/test_storage_runtime_863.c kernel/storage_runtime_863.c -o "build/s863-host/storage-$cc"
            "build/s863-host/storage-$cc" | tee "build/s863-host/storage-$cc.log"
          done
          clang --target=x86_64-w64-windows-gnu -std=c11 -O2 -Wall -Wextra -Werror -ffreestanding -fno-stack-protector -mno-red-zone -Iinclude -c kernel/storage_runtime_863.c -o build/s863-host/storage-runtime.obj
      - name: Fixed-fixture PIO write transport and flush refusal matrix
        run: |
          set -euo pipefail
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iinclude tests/test_ata_runtime_863.c kernel/{ata_runtime_863,ata_diag_857}.c -o "build/s863-host/ata-$cc"
            "build/s863-host/ata-$cc" | tee "build/s863-host/ata-$cc.log"
          done
          clang --target=x86_64-w64-windows-gnu -std=c11 -O2 -Wall -Wextra -Werror -ffreestanding -fno-stack-protector -mno-red-zone -Iinclude -c kernel/ata_runtime_863.c -o build/s863-host/ata-runtime.obj
      - name: Nonterminal syscall continuation and stale receipt refusal
        run: |
          set -euo pipefail
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -ffunction-sections -fdata-sections -Wl,--gc-sections -DSTYLEOS_TEST_RUNTIME_TICK_860 -DSTYLEOS_TEST_RUNTIME_SYSCALL_863 -Iinclude kernel/runtime_bank_862.c tests/test_runtime_syscall_863.c kernel/{desktop_process_runtime,process_scheduler,process_runtime,window_service,runtime_tick_860,process_entry_847,user_copy_772}.c -o "build/s863-host/syscall-$cc"
            "build/s863-host/syscall-$cc" | tee "build/s863-host/syscall-$cc.log"
          done
      - name: Cooperative context isolation and lifecycle stress
        run: |
          set -euo pipefail
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -ffunction-sections -fdata-sections -Wl,--gc-sections -DSTYLEOS_TEST_RUNTIME_TICK_860 -DSTYLEOS_TEST_RUNTIME_COOP_863 -Iinclude kernel/runtime_bank_862.c tests/test_runtime_coop_863.c kernel/{desktop_process_runtime,process_scheduler,process_runtime,window_service,runtime_tick_860,process_entry_847,user_copy_772}.c -o "build/s863-host/coop-$cc"
            "build/s863-host/coop-$cc" | tee "build/s863-host/coop-$cc.log"
          done
      - name: Build ordinary Desktop and verify linked shared-bootstrap calls
        run: |
          set -euo pipefail
          python3 tools/build.py --arch x86_64 --desktop-v0 --output build/s863-desktop
          python3 tools/test_runtime_bootstrap_863_verify.py --efi build/s863-desktop/x86_64/BOOTX64.EFI --map build/s863-desktop/x86_64/kernel.map
      - name: Preserve host and linked image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: styleos-863-shared-bootstrap
          path: |
            build/s863-host/*.log
            build/s863-desktop/manifest.json
            build/s863-desktop/x86_64/BOOTX64.EFI
            build/s863-desktop/x86_64/kernel.map
          if-no-files-found: warn
