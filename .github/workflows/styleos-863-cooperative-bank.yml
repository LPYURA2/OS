name: StyleOS 863 cooperative bank and actual INT80 continuation
on:
  push:
    branches: [feature/styleos-desktop-runtime-863]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install guest tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 ovmf dosfstools mtools
      - name: Eight real CPL3 trap and shared dispatcher boundaries
        run: python3 tools/test_runtime_coop_863_guest.py --output build/s863-coop
      - name: Replay original CPU trace and UART
        run: python3 tools/test_runtime_coop_863_replay.py build/s863-coop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-863-cooperative-bank
          path: build/s863-coop/
          if-no-files-found: warn
