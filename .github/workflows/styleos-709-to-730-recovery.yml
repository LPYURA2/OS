      - name: Archive complete exact commit and hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/recovery-canonical
          git rev-parse HEAD > build/recovery-canonical/SOURCE_COMMIT.txt
          git archive --format=zip -o build/recovery-canonical/StyleOS-Full-Source.zip HEAD
          unzip -t build/recovery-canonical/StyleOS-Full-Source.zip > build/recovery-canonical/source-zip-test.log
          (
            cd build/recovery-canonical
            sha256sum StyleOS-Full-Source.zip > SHA256SUMS-source.txt
            for f in compiler/x86_64/BOOTX64.EFI StyleOS-Recovery-Experimental.iso; do
              if test -f "$f"; then sha256sum "$f"; fi
            done > SHA256SUMS-binaries.txt
          )

