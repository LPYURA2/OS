name: StyleOS 709 to 730 canonical source + guest checks

on:
  push:
    branches:
      - restore/styleos-709-to-730-canonical
      - feature/styleos-process-snapshot-api-759
      - feature/styleos-process-runtime-760
      - feature/styleos-desktop-process-bootstrap-761
      - feature/styleos-owned-vm-stage-762
      - feature/styleos-cr3-roundtrip-763
      - feature/styleos-frame-ownership-764
      - feature/styleos-physical-grant-attestation-765
      - feature/styleos-user-session-boundary-766
      - feature/styleos-native-launch-transaction-767
      - feature/styleos-native-tea-cpl3-768
      - feature/styleos-guest-disk-tea-cpl3-769
      - feature/styleos-real-pid-user-session-window-770
      - feature/styleos-desktop-window-ipc-771
      - feature/styleos-cpl3-user-copy-772
      - feature/styleos-returning-cpl3-window-ipc-773
      - feature/styleos-native-desktop-presentation-774
      - feature/styleos-native-desktop-launch-775
      - feature/styleos-native-disk-staging-776
      - feature/styleos-attested-detached-roots-777
      - feature/styleos-kernel-closure-audit-778
      - feature/styleos-inherited-kernel-inventory-779
      - feature/styleos-kernel-dependency-census-780
      - feature/styleos-descriptor-provenance-781
      - feature/styleos-tss-ist-reserved-staging-782
      - feature/styleos-tss-descriptor-attestation-783
      - feature/styleos-tss-lgdt-ltr-trial-784
      - feature/styleos-ist-guard-table-plan-785
      - feature/styleos-hardware-ist-entry-786
      - feature/styleos-hardware-guard-pf-787
      - feature/styleos-hardware-double-fault-788
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-and-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact committed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install x86 UEFI and QEMU/OVMF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld dosfstools mtools xorriso qemu-system-x86 qemu-system-arm qemu-utils ovmf

      - name: Compile native x86-64 EFI from checked-out source
        run: |
          set -euo pipefail
          mkdir -p build/recovery-canonical
          python3 tools/build.py --arch x86_64 --desktop-v0 --output build/recovery-canonical/compiler 2>&1 | tee build/recovery-canonical/compile.log
          test -s build/recovery-canonical/compiler/x86_64/BOOTX64.EFI

      - name: Package bootable ISO
        run: |
          set -euo pipefail
          python3 tools/make_desktop_iso.py --efi build/recovery-canonical/compiler/x86_64/BOOTX64.EFI --output build/recovery-canonical/StyleOS-Recovery-Experimental.iso 2>&1 | tee build/recovery-canonical/iso.log
          test -s build/recovery-canonical/StyleOS-Recovery-Experimental.iso

      - name: Run mandatory host regressions
        run: |
          set -euo pipefail
          python3 tools/test.py --host --output build/recovery-canonical/host-check 2>&1 | tee build/recovery-canonical/host.log

      - name: Run mandatory real QEMU-OVMF guest desktop tests
        run: |
          set -euo pipefail
          python3 tools/test_desktop_v0.py --boot build/recovery-canonical/StyleOS-Recovery-Experimental.iso --output build/recovery-canonical/qemu-check 2>&1 | tee build/recovery-canonical/qemu.log

      - name: Run independent F5 app-session host regression
        run: |
          set -euo pipefail
          python3 tools/test_desktop_sessions.py --output build/recovery-canonical/f5-host 2>&1 | tee build/recovery-canonical/f5-host.log

      - name: Run separate Notes and Editor StyleFS v2 host regression
        run: |
          set -euo pipefail
          python3 tools/test_notes_file.py --output build/recovery-canonical/notes-host 2>&1 | tee build/recovery-canonical/notes-host.log

      - name: Run F8 F10 unsaved text real QEMU guest regression
        run: |
          set -euo pipefail
          python3 tools/test_730_shell_f10.py --iso build/recovery-canonical/StyleOS-Recovery-Experimental.iso --output build/recovery-canonical/f10-qemu 2>&1 | tee build/recovery-canonical/f10-qemu.log

      - name: Run independent F5 Notes guest regression
        run: |
          set -euo pipefail
          python3 tools/test_730_notes_f5.py --iso build/recovery-canonical/StyleOS-Recovery-Experimental.iso --output build/recovery-canonical/f5-qemu 2>&1 | tee build/recovery-canonical/f5-qemu.log

      - name: Assert two-volume disk mapping, no auto-format and read-only guards
        run: |
          set -euo pipefail
          python3 tools/test_desktop_volume_io.py --output build/recovery-canonical/volume-host 2>&1 | tee build/recovery-canonical/volume-host.log

      - name: Validate staged 20MiB cross-volume copy with ASAN and UBSAN
        run: |
          set -euo pipefail
          python3 tools/test_stylefs_background_copy.py --output build/recovery-canonical/copy-host 2>&1 | tee build/recovery-canonical/copy-host.log

      - name: Validate strict native .tea package format
        run: |
          set -euo pipefail
          python3 tools/test_tea_package.py --output build/recovery-canonical/tea-host 2>&1 | tee build/recovery-canonical/tea-host.log

      - name: Verify two actual IDE volumes in QEMU without modifying desktop
        run: |
          set -euo pipefail
          python3 tools/test_dual_guest.py --iso build/recovery-canonical/StyleOS-Recovery-Experimental.iso --output build/recovery-canonical/dual-qemu 2>&1 | tee build/recovery-canonical/dual-qemu.log

      - name: Verify Editor and Notes independent text mutation core
        run: |
          set -euo pipefail
          python3 tools/test_desktop_text_app.py --output build/recovery-canonical/text-app-host 2>&1 | tee build/recovery-canonical/text-app-host.log

      - name: Verify nine mandatory native .tea apps and atomic preinstall staging
        run: |
          set -euo pipefail
          python3 tools/test_preinstall_tea.py --output build/recovery-canonical/preinstall-host 2>&1 | tee build/recovery-canonical/preinstall-host.log

      - name: Verify process registry lifecycle and provenance
        run: |
          set -euo pipefail
          python3 tools/test_process_runtime.py --output build/recovery-canonical/process-host 2>&1 | tee build/recovery-canonical/process-host.log

      - name: Verify process-owned windows and approved system dialogs
        run: |
          set -euo pipefail
          python3 tools/test_window_service.py --output build/recovery-canonical/window-host 2>&1 | tee build/recovery-canonical/window-host.log

      - name: Verify kernel-owned app/session boundary and shell-independent window filtering
        run: |
          set -euo pipefail
          python3 tools/test_user_session_runtime.py --output build/recovery-canonical/user-session-host 2>&1 | tee build/recovery-canonical/user-session-host.log

      - name: Verify atomic native app PID, frame lease, session and window transactions
        run: |
          set -euo pipefail
          python3 tools/test_native_launch_stage.py --output build/recovery-canonical/native-launch-host 2>&1 | tee build/recovery-canonical/native-launch-host.log

      - name: Verify native window IPC contract, copy-only tiles, isolation and cleanup
        run: |
          set -euo pipefail
          python3 tools/test_native_window_channel.py --output build/recovery-canonical/window-ipc-host 2>&1 | tee build/recovery-canonical/window-ipc-host.log

      - name: Verify native desktop compositor bridge pixel clipping and revocation
        run: |
          set -euo pipefail
          python3 tools/test_native_desktop_bridge.py --output build/recovery-canonical/native-bridge-774-host 2>&1 | tee build/recovery-canonical/native-bridge-774-host.log

      - name: Verify atomic native process and window IPC admission with sanitizer and compositor pixel proof
        run: |
          set -euo pipefail
          python3 tools/test_native_desktop_launch.py --output build/recovery-canonical/native-admission-775-host 2>&1 | tee build/recovery-canonical/native-admission-775-host.log

      - name: Verify shared read-only .tea disk staging with ASAN UBSAN and COFF
        run: |
          set -euo pipefail
          python3 tools/test_native_tea_staging.py --output build/recovery-canonical/native-tea-staging-776-host 2>&1 | tee build/recovery-canonical/native-tea-staging-776-host.log

      - name: Verify process and window registry start empty in real UEFI guest
        run: |
          set -euo pipefail
          python3 tools/test_process_guest_boot.py --iso build/recovery-canonical/StyleOS-Recovery-Experimental.iso --output build/recovery-canonical/process-qemu 2>&1 | tee build/recovery-canonical/process-qemu.log

      - name: Verify Windows-style Task Manager kernel process inspector
        run: |
          set -euo pipefail
          python3 tools/test_process_inspector.py --output build/recovery-canonical/inspector-host 2>&1 | tee build/recovery-canonical/inspector-host.log

      - name: Verify Task Manager sort and search against scheduler-backed process model
        run: |
          set -euo pipefail
          python3 tools/test_process_view.py --output build/recovery-canonical/process-view-host 2>&1 | tee build/recovery-canonical/process-view-host.log

      - name: Verify capability-gated read-only process snapshot API
        run: |
          set -euo pipefail
          python3 tools/test_process_api.py --output build/recovery-canonical/process-api-host 2>&1 | tee build/recovery-canonical/process-api-host.log

      - name: Verify bounded scheduler host state machine + two architecture builds
        run: |
          set -euo pipefail
          python3 tools/test_process_scheduler.py --output build/recovery-canonical/scheduler-host 2>&1 | tee build/recovery-canonical/scheduler-host.log

      - name: Verify desktop-owned process bootstrap, protected snapshots and window lifecycle
        run: |
          set -euo pipefail
          python3 tools/test_desktop_process_runtime.py --output build/recovery-canonical/desktop-runtime-host 2>&1 | tee build/recovery-canonical/desktop-runtime-host.log

      - name: Verify dormant x86-64 W^X and private-table constructor
        run: |
          set -euo pipefail
          python3 tools/test_desktop_vm_stage.py --output build/recovery-canonical/desktop-vm-host 2>&1 | tee build/recovery-canonical/desktop-vm-host.log

      - name: Verify bounded physical-frame claim ledger and PID-safe page-root retirement
        run: |
          set -euo pipefail
          python3 tools/test_desktop_frame_owner.py --output build/recovery-canonical/frame-owner-host 2>&1 | tee build/recovery-canonical/frame-owner-host.log

      - name: Verify real CPL3 and EL0 traps drive registry PIDs in QEMU
        run: |
          set -euo pipefail
          python3 tools/test_process_scheduler_guest.py --arch all --output build/recovery-canonical/scheduler-guest 2>&1 | tee build/recovery-canonical/scheduler-guest.log

      - name: Prove x86-64 owned-table CR3 transition and inherited-root return in real QEMU
        run: |
          set -euo pipefail
          python3 tools/test_paging_roundtrip.py --output build/recovery-canonical/cr3-roundtrip 2>&1 | tee build/recovery-canonical/cr3-roundtrip.log

      - name: Check finite image-frame policy refusals with ASAN and UBSAN
        run: |
          set -euo pipefail
          python3 tools/test_frame_grant_proof.py --output build/recovery-canonical/grant-policy-host 2>&1 | tee build/recovery-canonical/grant-policy-host.log

      - name: Validate detached 777 page roots only after finite physical grants
        run: |
          set -euo pipefail
          python3 tools/test_desktop_grant_bridge.py --output build/recovery-canonical/attested-roots-777-host 2>&1 | tee build/recovery-canonical/attested-roots-777-host.log

      - name: Check bounded kernel closure roles before any detached CR3 switch
        run: |
          set -euo pipefail
          python3 tools/test_kernel_closure_audit.py --output build/recovery-canonical/kernel-closure-778-host 2>&1 | tee build/recovery-canonical/kernel-closure-778-host.log

      - name: Inventory inherited kernel mappings with ASAN UBSAN and COFF
        run: |
          set -euo pipefail
          python3 tools/test_kernel_mapping_inventory.py --output build/recovery-canonical/kernel-inventory-779-host 2>&1 | tee build/recovery-canonical/kernel-inventory-779-host.log

      - name: Audit loaded PE section W^X intent and missing hardware dependencies
        run: |
          set -euo pipefail
          python3 tools/test_kernel_dependency_inventory.py --output build/recovery-canonical/kernel-dependency-780-host 2>&1 | tee build/recovery-canonical/kernel-dependency-780-host.log

      - name: Prove descriptor and active boot-stack read-only audit with ASAN UBSAN and COFF
        run: |
          set -euo pipefail
          python3 tools/test_descriptor_state_781.py --output build/recovery-canonical/descriptor-781-host 2>&1 | tee build/recovery-canonical/descriptor-781-host.log

      - name: Verify candidate TSS IST frame admission with ASAN UBSAN and COFF
        run: |
          set -euo pipefail
          python3 tools/test_tss_ist_stage_782.py --output build/recovery-canonical/tss-782-host 2>&1 | tee build/recovery-canonical/tss-782-host.log

      - name: Verify inactive TSS descriptor with ASAN UBSAN and COFF
        run: |
          set -euo pipefail
          python3 tools/test_tss_descriptor_783.py --output build/recovery-canonical/tss-783-host 2>&1 | tee build/recovery-canonical/tss-783-host.log

      - name: Verify isolated 784 LTR terminal preflight with ASAN UBSAN COFF and negative parser
        run: |
          set -euo pipefail
          python3 tools/test_tss_ltr_784_host.py --output build/recovery-canonical/tss-784-host --desktop-efi build/recovery-canonical/compiler/x86_64/BOOTX64.EFI 2>&1 | tee build/recovery-canonical/tss-784-host.log
          python3 tools/test_tss_ltr_784_verify.py 2>&1 | tee build/recovery-canonical/tss-784-parser.log

      - name: Verify inactive 785 IST guard PTE layout with ASAN UBSAN and COFF
        run: |
          set -euo pipefail
          python3 tools/test_ist_guard_plan_785_host.py --output build/recovery-canonical/ist-guard-785-host 2>&1 | tee build/recovery-canonical/ist-guard-785-host.log

      - name: Reject forged 786 IST UART and wrong exit codes
        run: |
          set -euo pipefail
          python3 tools/test_ist_hw_786_verify.py 2>&1 | tee build/recovery-canonical/ist-786-parser.log

      - name: Prove live CR3 switch IST1 INT3 trap and absent active guard PTEs in QEMU
        run: |
          set -euo pipefail
          python3 tools/test_ist_hw_786_guest.py --output build/recovery-canonical/ist-786-qemu 2>&1 | tee build/recovery-canonical/ist-786-qemu.log

      - name: Reject forged 787 PF UART, wrong CR2, error codes and exit values
        run: |
          set -euo pipefail
          python3 tools/test_guard_pf_787_verify.py 2>&1 | tee build/recovery-canonical/guard-pf-787-parser.log

      - name: Prove actual guard-page supervisor write PF on separate IST2 in QEMU
        run: |
          set -euo pipefail
          python3 tools/test_guard_pf_787_guest.py --output build/recovery-canonical/guard-pf-787-qemu 2>&1 | tee build/recovery-canonical/guard-pf-787-qemu.log
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          p=Path('build/recovery-canonical/guard-pf-787-qemu/results.json')
          result=json.loads(p.read_text())
          assert result['status']=='PASS' and result['hardware_test'] is True
          assert result['qemu_exit_code']==33 and result['guard_page_fault_injected'] is True
          assert result['guard_pf_on_ist2_verified'] is True
          assert result['stack_exhaustion_recovery_verified'] is False
          PYCODE

      - name: Reject counterfeit 788 DF UART, nonzero error codes and false QEMU exits
        run: |
          set -euo pipefail
          python3 tools/test_double_fault_788_verify.py 2>&1 | tee build/recovery-canonical/double-fault-788-parser.log

      - name: Prove genuine nested fault hardware DF on independent IST3 in QEMU
        run: |
          set -euo pipefail
          python3 tools/test_double_fault_788_guest.py --output build/recovery-canonical/double-fault-788-qemu 2>&1 | tee build/recovery-canonical/double-fault-788-qemu.log
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          d=json.loads(Path('build/recovery-canonical/double-fault-788-qemu/results.json').read_text())
          assert d['status']=='PASS' and d['hardware_test'] is True
          assert d['qemu_exit_code']==33 and d['df_error_code_zero_verified'] is True
          assert d['genuine_double_fault_on_ist3_verified'] is True
          assert d['pf_gate_absent_while_df_gate_present'] is True
          assert d['stack_exhaustion_recovery_verified'] is False
          PYCODE

      - name: Attest 78 image-owned physical frames with real inherited CR3 walk in QEMU
        run: |
          set -euo pipefail
          python3 tools/test_frame_grant_guest.py --output build/recovery-canonical/grant-qemu 2>&1 | tee build/recovery-canonical/grant-qemu.log

      - name: Prove terminal LGDT LTR STR and busy TSS in real QEMU without UEFI return
        run: |
          set -euo pipefail
          python3 tools/test_tss_ltr_784_guest.py --output build/recovery-canonical/tss-784-qemu 2>&1 | tee build/recovery-canonical/tss-784-qemu.log

      - name: Validate narrow ELF64 .tea loader with ASAN UBSAN and COFF
        run: |
          set -euo pipefail
          python3 tools/test_native_tea_768_host.py --output build/recovery-canonical/native-tea-host 2>&1 | tee build/recovery-canonical/native-tea-host.log

      - name: Execute ELF64 from a canonical .tea in isolated real x86 CPL3 QEMU
        run: |
          set -euo pipefail
          python3 tools/test_native_tea_768_guest.py --output build/recovery-canonical/native-tea-qemu 2>&1 | tee build/recovery-canonical/native-tea-qemu.log

      - name: Verify canonical on-guest .tea ZIP and IDE header under ASAN UBSAN
        run: |
          set -euo pipefail
          python3 tools/test_native_tea_769_host.py --output build/recovery-canonical/native-tea-769-host 2>&1 | tee build/recovery-canonical/native-tea-769-host.log

      - name: Prove external disk .tea execution and tamper refusal in real CPL3 QEMU
        run: |
          set -euo pipefail
          python3 tools/test_native_tea_769_guest.py --output build/recovery-canonical/native-tea-769-qemu 2>&1 | tee build/recovery-canonical/native-tea-769-qemu.log

      - name: Verify native hardware PID-to-session/window lifecycle with sanitized host fixture
        run: |
          set -euo pipefail
          python3 tools/test_native_session_hw_770.py --output build/recovery-canonical/native-session-770-host 2>&1 | tee build/recovery-canonical/native-session-770-host.log

      - name: Execute disk .tea in CPL3 with per-user session window ownership in QEMU
        run: |
          set -euo pipefail
          python3 tools/test_native_tea_770_guest.py --output build/recovery-canonical/native-session-770-qemu 2>&1 | tee build/recovery-canonical/native-session-770-qemu.log

      - name: Verify bounded kernel user copy, output-on-error invariants and x86 COFF
        run: |
          set -euo pipefail
          python3 tools/test_user_copy_772.py --output build/recovery-canonical/user-copy-772-host 2>&1 | tee build/recovery-canonical/user-copy-772-host.log

      - name: Hardware prove x86 CPL3 INT80 copied user stack and denied foreign page
        run: |
          set -euo pipefail
          python3 tools/test_user_syscall_772_guest.py --output build/recovery-canonical/user-copy-772-qemu 2>&1 | tee build/recovery-canonical/user-copy-772-qemu.log

      - name: Check versioned returning IPC 773 with ASAN UBSAN and COFF
        run: |
          set -euo pipefail
          python3 tools/test_user_ipc_773.py --output build/recovery-canonical/user-ipc-773-host 2>&1 | tee build/recovery-canonical/user-ipc-773-host.log

      - name: Prove two real CPL3 IRET replies, denied foreign pointer and window IPC
        run: |
          set -euo pipefail
          python3 tools/test_user_ipc_773_guest.py --output build/recovery-canonical/user-ipc-773-qemu 2>&1 | tee build/recovery-canonical/user-ipc-773-qemu.log

      - name: Archive complete exact commit and hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/recovery-canonical
          git rev-parse HEAD > build/recovery-canonical/SOURCE_COMMIT.txt
          git archive --format=zip -o build/recovery-canonical/StyleOS-Full-Source.zip HEAD
          unzip -t build/recovery-canonical/StyleOS-Full-Source.zip > build/recovery-canonical/source-zip-test.log
          (
            cd build/recovery-canonical
            sha256sum StyleOS-Full-Source.zip > SHA256SUMS-source.txt
            for f in compiler/x86_64/BOOTX64.EFI StyleOS-Recovery-Experimental.iso; do
              if test -f "$f"; then sha256sum "$f"; fi
            done > SHA256SUMS-binaries.txt
          )

      - name: Upload recoverable source, binaries and evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: styleos-recovery-source-iso-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/recovery-canonical/SOURCE_COMMIT.txt
            build/recovery-canonical/StyleOS-Full-Source.zip
            build/recovery-canonical/SHA256SUMS-source.txt
            build/recovery-canonical/SHA256SUMS-binaries.txt
            build/recovery-canonical/source-zip-test.log
            build/recovery-canonical/StyleOS-Recovery-Experimental.iso
            build/recovery-canonical/compiler/x86_64/BOOTX64.EFI
            build/recovery-canonical/compiler/manifest.json
            build/recovery-canonical/*.log
            build/recovery-canonical/qemu-check/results.json
            build/recovery-canonical/f10-qemu/results.json
            build/recovery-canonical/f5-qemu/results.json
            build/recovery-canonical/f5-qemu/qemu/*.ppm
            build/recovery-canonical/f5-host/result.json
            build/recovery-canonical/copy-host/test.log
            build/recovery-canonical/notes-host/test.log
            build/recovery-canonical/text-app-host.log
            build/recovery-canonical/process-qemu.log
            build/recovery-canonical/process-qemu/results.json
            build/recovery-canonical/inspector-host.log
            build/recovery-canonical/process-view-host.log
            build/recovery-canonical/process-api-host.log
            build/recovery-canonical/desktop-runtime-host.log
            build/recovery-canonical/user-session-host.log
            build/recovery-canonical/window-ipc-host.log
            build/recovery-canonical/window-ipc-host/test.log
            build/recovery-canonical/native-bridge-774-host.log
            build/recovery-canonical/native-admission-775-host.log
            build/recovery-canonical/native-admission-775-host/test.log
            build/recovery-canonical/native-bridge-774-host/test.log
            build/recovery-canonical/user-copy-772-host.log
            build/recovery-canonical/user-copy-772-host/test.log
            build/recovery-canonical/user-copy-772-qemu.log
            build/recovery-canonical/user-ipc-773-host.log
            build/recovery-canonical/user-ipc-773-host/host.log
            build/recovery-canonical/user-ipc-773-qemu.log
            build/recovery-canonical/user-ipc-773-qemu/results.json
            build/recovery-canonical/user-ipc-773-qemu/success/qemu/UART.log
            build/recovery-canonical/user-ipc-773-qemu/denial/qemu/UART.log
            build/recovery-canonical/user-ipc-773-qemu/success/qemu/QEMU.log
            build/recovery-canonical/user-ipc-773-qemu/denial/qemu/QEMU.log
            build/recovery-canonical/user-ipc-773-host.log
            build/recovery-canonical/user-ipc-773-host/host.log
            build/recovery-canonical/user-ipc-773-qemu.log
            build/recovery-canonical/user-ipc-773-qemu/results.json
            build/recovery-canonical/user-ipc-773-qemu/success/qemu/UART.log
            build/recovery-canonical/user-ipc-773-qemu/denial/qemu/UART.log
            build/recovery-canonical/user-ipc-773-qemu/success/qemu/QEMU.log
            build/recovery-canonical/user-ipc-773-qemu/denial/qemu/QEMU.log
            build/recovery-canonical/user-copy-772-qemu/results.json
            build/recovery-canonical/user-copy-772-qemu/*/qemu/UART.log
            build/recovery-canonical/user-copy-772-qemu/*/qemu/QEMU.log
            build/recovery-canonical/user-copy-772-qemu/*-build.log
            build/recovery-canonical/user-copy-772-qemu/*/compiled/x86_64/BOOTX64.EFI
            build/recovery-canonical/native-launch-host.log
            build/recovery-canonical/native-tea-host.log
            build/recovery-canonical/native-tea-host/test.log
            build/recovery-canonical/native-tea-qemu.log
