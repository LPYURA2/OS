  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-and-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact committed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install x86 UEFI and QEMU/OVMF tools
        run: |
          timeout 900s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=35 update
          timeout 900s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=35 install -y clang lld dosfstools mtools xorriso qemu-system-x86 qemu-system-arm qemu-utils ovmf acpica-tools

      - name: 820 Verify pinned genuine ACPICA source and compile interpreter components for x86 COFF
        run: |
          set -euo pipefail
          mkdir -p build/recovery-canonical/acpica-820
          curl -fL --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 180 \
            'https://github.com/open-acpica/acpica/releases/download/20260930/acpica-unix-20260930.tar.gz' \
            -o build/recovery-canonical/acpica-820/upstream.tar.gz
          printf '%s  %s\n' \
            'aa18901b92e30749be0edc3081c8d550c61fce4fa37546fc6a65d367a4ae71a5' \
            'build/recovery-canonical/acpica-820/upstream.tar.gz' | sha256sum -c -
          python3 tools/acpica_source_820.py \
            --archive build/recovery-canonical/acpica-820/upstream.tar.gz \
            --output build/recovery-canonical/acpica-820/source-manifest.json \
            --extract-to build/recovery-canonical/acpica-820/verified \
            2>&1 | tee build/recovery-canonical/acpica-820/source-verify.log
          SRC=build/recovery-canonical/acpica-820/verified/source
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -Wno-unused-parameter -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I "$SRC/include" -I include \
            kernel/acpica_bridge_819.c tests/test_acpica_abi_820.c \
            -o build/recovery-canonical/acpica-820/abi-host
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            build/recovery-canonical/acpica-820/abi-host \
            2>&1 | tee build/recovery-canonical/acpica-820/abi-host.log
          clang --target=x86_64-pc-win32-coff -std=c11 -O2 -ffreestanding -D_GNU_EFI \
            -fno-builtin -include include/styleos/acpica_efi_prelude_821.h -I "$SRC/include" -I include \
            -c tests/test_acpica_abi_820.c \
            -o build/recovery-canonical/acpica-820/abi-coff.o
          for name in utilities/utxfinit namespace/nsxfname parser/psparse; do
            dest="build/recovery-canonical/acpica-820/$(basename "$name").obj"
            clang --target=x86_64-pc-win32-coff -std=c11 -O2 -ffreestanding -D_GNU_EFI \
              -fno-builtin -DACPI_MACHINE_WIDTH=64 -include include/styleos/acpica_efi_prelude_821.h -I "$SRC/include" \
              -c "$SRC/components/$name.c" -o "$dest"
          done
          file build/recovery-canonical/acpica-820/*.o build/recovery-canonical/acpica-820/*.obj \
            | tee build/recovery-canonical/acpica-820/coff-objects.log
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          p=Path('build/recovery-canonical/acpica-820/source-manifest.json')
          j=json.loads(p.read_text())
          assert j['version']=='20260930' and j['all_sources_verified']
          assert not j['guest_acpica_linked'] and not j['dma_authorized']
          assert not j['foundation_complete']
          print('STYLEOS S820 GATE PASS: verified core COFF, ABI, NO guest interpreter')
          PYCODE

      - name: 821 Build real complete ACPICA COFF core and execute upstream checksum in QEMU
        run: |
          set -euo pipefail
          mkdir -p build/recovery-canonical/acpica-821
          python3 - <<'PYCODE'
          import hashlib, tarfile
          from pathlib import Path
          origin=Path('build/recovery-canonical/acpica-820/upstream.tar.gz')
          assert hashlib.sha256(origin.read_bytes()).hexdigest()=='aa18901b92e30749be0edc3081c8d550c61fce4fa37546fc6a65d367a4ae71a5'
          with tarfile.open(origin,'r:gz') as tar:
              members=[m for m in tar.getmembers() if m.isfile() and m.name.endswith('/LICENSE.BSD-3-Clause')]
              assert len(members)==1 and 200 < members[0].size < 10000
              data=tar.extractfile(members[0]).read()
          assert b'Redistribution' in data and b'copyright' in data.lower()
          Path('build/recovery-canonical/acpica-821/LICENSE.BSD-3-Clause').write_bytes(data)
          print('S821 pinned ACPICA BSD license retained in binary evidence')
          PYCODE
          python3 tools/test_acpica_core_821.py \
            --verified-source build/recovery-canonical/acpica-820/verified/source \
            --source-manifest build/recovery-canonical/acpica-820/source-manifest.json \
            --output build/recovery-canonical/acpica-821/qemu \
            2>&1 | tee build/recovery-canonical/acpica-821/run.log
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          root=Path('build/recovery-canonical/acpica-821/qemu')
          core=json.loads((root/'upstream-core/core-manifest.json').read_text())
          evidence=json.loads((root/'results.json').read_text())
          assert core['core_source_count']>=160 and core['target']=='x86_64-pc-win32-coff'
          assert core['upstream_sha256']=='aa18901b92e30749be0edc3081c8d550c61fce4fa37546fc6a65d367a4ae71a5'
          assert {'AcpiEvaluateObject','AcpiInitializeSubsystem','AcpiLoadTables','AcpiUtChecksum'}<=set(core['entrypoints_present'])
          assert evidence['stage']==821 and evidence['status']=='PASS'
          assert evidence['guest_acpica_linked'] and not evidence['guest_aml_executed']
          for m in ('disabled','intel','bridge-intel','bridge-two-hop-intel'):
              d=evidence['modes'][m]
              assert d['status']=='PASS' and d['qemu_exit_code']==33
              assert d['observations']['acpica821_core_checksum_real_guest']
              assert not d['observations']['acpica821_guest_aml_evaluated']
          assert not evidence['dma_access_authorized'] and not evidence['production_cr3_authorized']
          print('STYLEOS S821 REAL ACPICA CORE COFF + GUEST CHECKSUM PASS; AML NOT RUN')
          PYCODE

      - name: 821 Reject forged ACPICA native checksum, AML and DMA records
        run: |
          set -euo pipefail
          python3 tools/test_acpica_core_821_negative.py \
            --qemu-dir build/recovery-canonical/acpica-821/qemu \
            2>&1 | tee build/recovery-canonical/acpica-821/negative.log

      - name: 822 Execute real ACPICA AML on synthetic DSDT and SSDT in QEMU OVMF
        run: |
          set -euo pipefail
          mkdir -p build/recovery-canonical/acpica-822
          python3 tools/test_acpica_aml_822.py \
            --core-lib build/recovery-canonical/acpica-821/qemu/upstream-core/libacpica-core-821.lib \
            --core-include build/recovery-canonical/acpica-820/verified/source/include \
            --output build/recovery-canonical/acpica-822/qemu \
            2>&1 | tee build/recovery-canonical/acpica-822/run.log
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          r=json.loads(Path('build/recovery-canonical/acpica-822/qemu/results.json').read_text())
          assert r['stage']==822 and r['status']=='PASS'
          assert r['guest_real_acpica_evaluate_object'] and r['synthetic_dsdt_ssdt_only']
          assert r['hardware_operationregion_permissions']=='deny-all'
          assert not r['dma_access_authorized'] and not r['foundation_complete']
          for mode in ('disabled','intel','bridge-intel','bridge-two-hop-intel'):
              d=r['modes'][mode]
              assert d['status']=='PASS' and d['qemu_exit_code']==33
              assert d['observations']['acpica822_real_aml_evaluated']
              assert not d['observations']['acpica822_real_firmware_methods_evaluated']
          print('STYLEOS S822 REAL SYNTHETIC DSDT/SSDT AML PASS; NOT FIRMWARE AML')
          PYCODE

      - name: 822 Reject forged AML, DMA grants and missing UART
        run: |
          set -euo pipefail
          python3 tools/test_acpica_aml_822_negative.py \
            --parent-uart build/recovery-canonical/acpica-821/qemu/disabled/serial.log \
            2>&1 | tee build/recovery-canonical/acpica-822/negative.log

      - name: 823 Evaluate guarded genuine firmware PCI0 _HID _CRS in QEMU OVMF
        run: |
          set -euo pipefail
          mkdir -p build/recovery-canonical/acpica-823
          python3 tools/test_acpica_firmware_823.py \
            --core-lib build/recovery-canonical/acpica-821/qemu/upstream-core/libacpica-core-821.lib \
            --core-include build/recovery-canonical/acpica-820/verified/source/include \
            --output build/recovery-canonical/acpica-823/qemu \
            2>&1 | tee build/recovery-canonical/acpica-823/run.log
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          r=json.loads(Path('build/recovery-canonical/acpica-823/qemu/results.json').read_text())
          assert r['stage']==823 and r['status']=='PASS'
          assert r['guest_real_acpica_evaluate_object'] and r['firmware_dsdt_readonly']
          assert not r['dma_access_authorized'] and not r['foundation_complete']
          assert not r['ecam_reservation_verified'] and not r['production_cr3_authorized']
          for mode in ('disabled','intel','bridge-intel','bridge-two-hop-intel'):
              d=r['modes'][mode]
              assert d['status']=='PASS' and d['qemu_exit_code']==33
              assert d['observations']['acpica823_firmware_hid_evaluated']
              assert d['observations']['acpica823_firmware_crs_evaluated']
          print('STYLEOS S823 GUARDED REAL FIRMWARE HOSTBRIDGE PASS; ECAM DMA DENY')
          PYCODE

      - name: 823 Reject forged real firmware AML and hardware authority
        run: |
          set -euo pipefail
          python3 tools/test_acpica_firmware_823_negative.py \
            --parent-uart build/recovery-canonical/acpica-821/qemu/disabled/serial.log \
            2>&1 | tee build/recovery-canonical/acpica-823/negative.log

      - name: 824 Refuse malformed resource descriptors and forged UART
        if: github.ref_name == 'feature/styleos-acpi-resources-824' || github.ref_name == 'feature/styleos-acpi-windows-825' || github.ref_name == 'feature/styleos-ecam-evidence-826' || github.ref_name == 'feature/styleos-ecam-quarantine-827' || github.ref_name == 'feature/styleos-iommu-evidence-828' || github.ref_name == 'feature/styleos-requester-plan-829' || github.ref_name == 'feature/styleos-irq-sources-830' || github.ref_name == 'feature/styleos-dma-association-831' || github.ref_name == 'feature/styleos-iommu-base-page-832' || github.ref_name == 'feature/styleos-iommu-aperture-833' || github.ref_name == 'feature/styleos-post-ebs-aperture-834' || github.ref_name == 'feature/styleos-iommu-quarantine-835' || github.ref_name == 'feature/styleos-ownership-compose-836' || github.ref_name == 'feature/styleos-guest-plan-837' || github.ref_name == 'feature/styleos-mapping-contract-838' || github.ref_name == 'feature/styleos-observation-collector-839' || github.ref_name == 'feature/styleos-guest-observation-840' || github.ref_name == 'feature/styleos-alias-census-841' || github.ref_name == 'feature/styleos-apic-root-842' || github.ref_name == 'feature/styleos-timer-scheduler-843' || github.ref_name == 'feature/styleos-physical-arena-844' || github.ref_name == 'feature/styleos-task-stacks-845' || github.ref_name == 'feature/styleos-user-roots-846'
        run: |
          set -euo pipefail
          mkdir -p build/recovery-canonical/acpi-824
          python3 tools/test_acpi_resources_824.py --parent-uart build/recovery-canonical/acpica-823/qemu/disabled/serial.log \
            2>&1 | tee build/recovery-canonical/acpi-824/negative.log

      - name: 824 Capture evaluated PCI0 CRS and correlate UEFI MCFG live buses
        if: github.ref_name == 'feature/styleos-acpi-resources-824' || github.ref_name == 'feature/styleos-acpi-windows-825' || github.ref_name == 'feature/styleos-ecam-evidence-826' || github.ref_name == 'feature/styleos-ecam-quarantine-827' || github.ref_name == 'feature/styleos-iommu-evidence-828' || github.ref_name == 'feature/styleos-requester-plan-829' || github.ref_name == 'feature/styleos-irq-sources-830' || github.ref_name == 'feature/styleos-dma-association-831' || github.ref_name == 'feature/styleos-iommu-base-page-832' || github.ref_name == 'feature/styleos-iommu-aperture-833' || github.ref_name == 'feature/styleos-post-ebs-aperture-834' || github.ref_name == 'feature/styleos-iommu-quarantine-835' || github.ref_name == 'feature/styleos-ownership-compose-836' || github.ref_name == 'feature/styleos-guest-plan-837' || github.ref_name == 'feature/styleos-mapping-contract-838' || github.ref_name == 'feature/styleos-observation-collector-839' || github.ref_name == 'feature/styleos-guest-observation-840' || github.ref_name == 'feature/styleos-alias-census-841' || github.ref_name == 'feature/styleos-apic-root-842' || github.ref_name == 'feature/styleos-timer-scheduler-843' || github.ref_name == 'feature/styleos-physical-arena-844' || github.ref_name == 'feature/styleos-task-stacks-845' || github.ref_name == 'feature/styleos-user-roots-846'
        run: |
          set -euo pipefail
          mkdir -p build/recovery-canonical/acpi-824
          python3 tools/test_acpica_firmware_823.py --resources-824 \
            --core-lib build/recovery-canonical/acpica-821/qemu/upstream-core/libacpica-core-821.lib \
            --core-include build/recovery-canonical/acpica-820/verified/source/include \
            --output build/recovery-canonical/acpi-824/qemu \
            2>&1 | tee build/recovery-canonical/acpi-824/run.log
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          r=json.loads(Path('build/recovery-canonical/acpi-824/qemu/results.json').read_text())
          assert r['stage']==824 and r['status']=='PASS'
          for mode,d in r['modes'].items():
              if mode=='amd' and d['status']=='SKIPPED': continue
              assert d['status']=='PASS' and d['qemu_exit_code']==33
              assert d['observations']['s824_live_bus_coverage']
              assert not d['observations']['s824_resource_ownership']
          assert not r['dma_access_authorized'] and not r['production_cr3_authorized']
          PYCODE

      - name: 825 Audit same-boot allocated UEFI windows against AML producer windows and ECAM exclusion
        if: github.ref_name == 'feature/styleos-acpi-windows-825' || github.ref_name == 'feature/styleos-ecam-evidence-826' || github.ref_name == 'feature/styleos-ecam-quarantine-827' || github.ref_name == 'feature/styleos-iommu-evidence-828' || github.ref_name == 'feature/styleos-requester-plan-829' || github.ref_name == 'feature/styleos-irq-sources-830' || github.ref_name == 'feature/styleos-dma-association-831' || github.ref_name == 'feature/styleos-iommu-base-page-832' || github.ref_name == 'feature/styleos-iommu-aperture-833' || github.ref_name == 'feature/styleos-post-ebs-aperture-834' || github.ref_name == 'feature/styleos-iommu-quarantine-835' || github.ref_name == 'feature/styleos-ownership-compose-836' || github.ref_name == 'feature/styleos-guest-plan-837' || github.ref_name == 'feature/styleos-mapping-contract-838' || github.ref_name == 'feature/styleos-observation-collector-839' || github.ref_name == 'feature/styleos-guest-observation-840' || github.ref_name == 'feature/styleos-alias-census-841' || github.ref_name == 'feature/styleos-apic-root-842' || github.ref_name == 'feature/styleos-timer-scheduler-843' || github.ref_name == 'feature/styleos-physical-arena-844' || github.ref_name == 'feature/styleos-task-stacks-845' || github.ref_name == 'feature/styleos-user-roots-846'
        run: |
          set -euo pipefail
          mkdir -p build/recovery-canonical/acpi-825
          python3 tools/test_acpi_windows_825.py --input build/recovery-canonical/acpi-824/qemu \
            --output build/recovery-canonical/acpi-825 2>&1 | tee build/recovery-canonical/acpi-825/run.log

      - name: 826 Test final map capture and replay guards on authentic parent UART with synthetic records
        if: github.ref_name == 'feature/styleos-ecam-evidence-826' || github.ref_name == 'feature/styleos-ecam-quarantine-827' || github.ref_name == 'feature/styleos-iommu-evidence-828' || github.ref_name == 'feature/styleos-requester-plan-829' || github.ref_name == 'feature/styleos-irq-sources-830' || github.ref_name == 'feature/styleos-dma-association-831' || github.ref_name == 'feature/styleos-iommu-base-page-832' || github.ref_name == 'feature/styleos-iommu-aperture-833' || github.ref_name == 'feature/styleos-post-ebs-aperture-834' || github.ref_name == 'feature/styleos-iommu-quarantine-835' || github.ref_name == 'feature/styleos-ownership-compose-836' || github.ref_name == 'feature/styleos-guest-plan-837' || github.ref_name == 'feature/styleos-mapping-contract-838' || github.ref_name == 'feature/styleos-observation-collector-839' || github.ref_name == 'feature/styleos-guest-observation-840' || github.ref_name == 'feature/styleos-alias-census-841' || github.ref_name == 'feature/styleos-apic-root-842' || github.ref_name == 'feature/styleos-timer-scheduler-843' || github.ref_name == 'feature/styleos-physical-arena-844' || github.ref_name == 'feature/styleos-task-stacks-845' || github.ref_name == 'feature/styleos-user-roots-846'
        run: |
          set -euo pipefail
          mkdir -p build/recovery-canonical/acpi-826
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I include kernel/ecam_map_capture_826.c kernel/boot_info.c tests/test_map_capture_826.c -o build/recovery-canonical/acpi-826/host
          build/recovery-canonical/acpi-826/host | tee build/recovery-canonical/acpi-826/map-host.log
          clang --target=x86_64-pc-windows-msvc -ffreestanding -fno-stack-protector -Wall -Wextra -Werror -I include -c kernel/ecam_map_capture_826.c -o build/recovery-canonical/acpi-826/map-capture.coff.o
          python3 tools/uefi_map_826.py --selftest | tee build/recovery-canonical/acpi-826/map-parser.log
