name: StyleOS 709 to 730 canonical source + guest checks

on:
  push:
    branches:
      - restore/styleos-709-to-730-canonical
      - feature/styleos-process-snapshot-api-759
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact committed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install x86 UEFI and QEMU/OVMF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld dosfstools mtools xorriso qemu-system-x86 qemu-utils ovmf

      - name: Compile native x86-64 EFI from checked-out source
        run: |
          set -euo pipefail
          mkdir -p build/recovery-canonical
          python3 tools/build.py --arch x86_64 --desktop-v0 --output build/recovery-canonical/compiler 2>&1 | tee build/recovery-canonical/compile.log
          test -s build/recovery-canonical/compiler/x86_64/BOOTX64.EFI

      - name: Package bootable ISO
        run: |
          set -euo pipefail
          python3 tools/make_desktop_iso.py --efi build/recovery-canonical/compiler/x86_64/BOOTX64.EFI --output build/recovery-canonical/StyleOS-Recovery-Experimental.iso 2>&1 | tee build/recovery-canonical/iso.log
          test -s build/recovery-canonical/StyleOS-Recovery-Experimental.iso

      - name: Run mandatory host regressions
        run: |
          set -euo pipefail
          python3 tools/test.py --host --output build/recovery-canonical/host-check 2>&1 | tee build/recovery-canonical/host.log

      - name: Run mandatory real QEMU-OVMF guest desktop tests
        run: |
          set -euo pipefail
          python3 tools/test_desktop_v0.py --boot build/recovery-canonical/StyleOS-Recovery-Experimental.iso --output build/recovery-canonical/qemu-check 2>&1 | tee build/recovery-canonical/qemu.log

      - name: Run independent F5 app-session host regression
        run: |
          set -euo pipefail
          python3 tools/test_desktop_sessions.py --output build/recovery-canonical/f5-host 2>&1 | tee build/recovery-canonical/f5-host.log

      - name: Run separate Notes and Editor StyleFS v2 host regression
        run: |
          set -euo pipefail
          python3 tools/test_notes_file.py --output build/recovery-canonical/notes-host 2>&1 | tee build/recovery-canonical/notes-host.log

      - name: Run F8 F10 unsaved text real QEMU guest regression
        run: |
          set -euo pipefail
          python3 tools/test_730_shell_f10.py --iso build/recovery-canonical/StyleOS-Recovery-Experimental.iso --output build/recovery-canonical/f10-qemu 2>&1 | tee build/recovery-canonical/f10-qemu.log

      - name: Run independent F5 Notes guest regression
        run: |
          set -euo pipefail
          python3 tools/test_730_notes_f5.py --iso build/recovery-canonical/StyleOS-Recovery-Experimental.iso --output build/recovery-canonical/f5-qemu 2>&1 | tee build/recovery-canonical/f5-qemu.log

      - name: Assert two-volume disk mapping, no auto-format and read-only guards
        run: |
          set -euo pipefail
          python3 tools/test_desktop_volume_io.py --output build/recovery-canonical/volume-host 2>&1 | tee build/recovery-canonical/volume-host.log

      - name: Validate staged 20MiB cross-volume copy with ASAN and UBSAN
        run: |
          set -euo pipefail
          python3 tools/test_stylefs_background_copy.py --output build/recovery-canonical/copy-host 2>&1 | tee build/recovery-canonical/copy-host.log

      - name: Validate strict native .tea package format
        run: |
          set -euo pipefail
          python3 tools/test_tea_package.py --output build/recovery-canonical/tea-host 2>&1 | tee build/recovery-canonical/tea-host.log

      - name: Verify two actual IDE volumes in QEMU without modifying desktop
        run: |
          set -euo pipefail
          python3 tools/test_dual_guest.py --iso build/recovery-canonical/StyleOS-Recovery-Experimental.iso --output build/recovery-canonical/dual-qemu 2>&1 | tee build/recovery-canonical/dual-qemu.log

      - name: Verify Editor and Notes independent text mutation core
        run: |
          set -euo pipefail
          python3 tools/test_desktop_text_app.py --output build/recovery-canonical/text-app-host 2>&1 | tee build/recovery-canonical/text-app-host.log

      - name: Verify nine mandatory native .tea apps and atomic preinstall staging
        run: |
          set -euo pipefail
          python3 tools/test_preinstall_tea.py --output build/recovery-canonical/preinstall-host 2>&1 | tee build/recovery-canonical/preinstall-host.log

      - name: Verify process registry lifecycle and provenance
        run: |
          set -euo pipefail
          python3 tools/test_process_runtime.py --output build/recovery-canonical/process-host 2>&1 | tee build/recovery-canonical/process-host.log

      - name: Verify process-owned windows and approved system dialogs
        run: |
          set -euo pipefail
          python3 tools/test_window_service.py --output build/recovery-canonical/window-host 2>&1 | tee build/recovery-canonical/window-host.log

      - name: Verify process and window registry start empty in real UEFI guest
        run: |
          set -euo pipefail
          python3 tools/test_process_guest_boot.py --iso build/recovery-canonical/StyleOS-Recovery-Experimental.iso --output build/recovery-canonical/process-qemu 2>&1 | tee build/recovery-canonical/process-qemu.log

      - name: Verify Windows-style Task Manager kernel process inspector
        run: |
          set -euo pipefail
          python3 tools/test_process_inspector.py --output build/recovery-canonical/inspector-host 2>&1 | tee build/recovery-canonical/inspector-host.log

      - name: Verify Task Manager sort and search against scheduler-backed process model
        run: |
          set -euo pipefail
          python3 tools/test_process_view.py --output build/recovery-canonical/process-view-host 2>&1 | tee build/recovery-canonical/process-view-host.log

      - name: Verify capability-gated read-only process snapshot API
        run: |
          set -euo pipefail
          python3 tools/test_process_api.py --output build/recovery-canonical/process-api-host 2>&1 | tee build/recovery-canonical/process-api-host.log

      - name: Archive complete exact commit and hashes
        if: always()
        run: |
          set -euo pipefail
          mkdir -p build/recovery-canonical
          git rev-parse HEAD > build/recovery-canonical/SOURCE_COMMIT.txt
          git archive --format=zip -o build/recovery-canonical/StyleOS-Full-Source.zip HEAD
          unzip -t build/recovery-canonical/StyleOS-Full-Source.zip > build/recovery-canonical/source-zip-test.log
          (
            cd build/recovery-canonical
            sha256sum StyleOS-Full-Source.zip > SHA256SUMS-source.txt
            for f in compiler/x86_64/BOOTX64.EFI StyleOS-Recovery-Experimental.iso; do
              if test -f "$f"; then sha256sum "$f"; fi
            done > SHA256SUMS-binaries.txt
          )

      - name: Upload recoverable source, binaries and evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: styleos-recovery-source-iso-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/recovery-canonical/SOURCE_COMMIT.txt
            build/recovery-canonical/StyleOS-Full-Source.zip
            build/recovery-canonical/SHA256SUMS-source.txt
            build/recovery-canonical/SHA256SUMS-binaries.txt
            build/recovery-canonical/source-zip-test.log
            build/recovery-canonical/StyleOS-Recovery-Experimental.iso
            build/recovery-canonical/compiler/x86_64/BOOTX64.EFI
            build/recovery-canonical/compiler/manifest.json
            build/recovery-canonical/*.log
            build/recovery-canonical/qemu-check/results.json
            build/recovery-canonical/f10-qemu/results.json
            build/recovery-canonical/f5-qemu/results.json
            build/recovery-canonical/f5-qemu/qemu/*.ppm
            build/recovery-canonical/f5-host/result.json
            build/recovery-canonical/copy-host/test.log
            build/recovery-canonical/notes-host/test.log
            build/recovery-canonical/text-app-host.log
            build/recovery-canonical/process-qemu.log
            build/recovery-canonical/process-qemu/results.json
            build/recovery-canonical/inspector-host.log
            build/recovery-canonical/process-view-host.log
            build/recovery-canonical/process-api-host.log
            build/recovery-canonical/process-host.log
            build/recovery-canonical/window-host.log
            build/recovery-canonical/preinstall-host.log
            build/recovery-canonical/preinstall-host/result.json
            build/recovery-canonical/tea-host.log
            build/recovery-canonical/dual-qemu.log
            build/recovery-canonical/dual-qemu/results.json
            build/recovery-canonical/dual-qemu/dual/COM1.log
            build/recovery-canonical/host-check/logs/results.json
