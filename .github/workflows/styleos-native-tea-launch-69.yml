name: StyleOS native apps and Deep Drop acceptance
on:
  push:
    branches: [feature/styleos-native-tea-launch-69, feature/styleos-native-app-acceptance-70, feature/styleos-deep-drop-71, feature/styleos-deep-drop-72]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deep-drop-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bounded transfer broker GCC and Clang ASan UBSan
        run: |
          set -euo pipefail
          mkdir -p build/deep-drop
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iinclude tests/test_deep_drop.c kernel/{deep_drop,process_runtime,window_service,user_session_runtime,native_window_channel}.c -o "build/deep-drop/$cc"
            "build/deep-drop/$cc" | tee "build/deep-drop/$cc.log"
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Iinclude tests/test_deep_drop_ipc.c kernel/{deep_drop,deep_drop_ipc,process_runtime,window_service,user_session_runtime,native_window_channel}.c -o "build/deep-drop/ipc-$cc"
            "build/deep-drop/ipc-$cc" | tee "build/deep-drop/ipc-$cc.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-drop-host
          path: build/deep-drop/
  stop-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: GCC and Clang sanitized lifecycle and refusals
        run: |
          set -euo pipefail
          mkdir -p build/forced-stop
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -ffunction-sections -fdata-sections -Wl,--gc-sections -DSTYLEOS_KERNEL_CAPACITY_32 -DSTYLEOS_OWNED_SHELL_865 -Iinclude tests/test_native_forced_stop.c kernel/{runtime_bank_862,desktop_process_runtime,process_scheduler,process_runtime,window_service,runtime_tick_860,process_entry_847,user_copy_772}.c -o "build/forced-stop/$cc"
            "build/forced-stop/$cc" | tee "build/forced-stop/$cc.log"
          done
      - name: Install package build tools
        run: |
          set -euo pipefail
          opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          sudo apt-get "${opts[@]}" update
          sudo apt-get "${opts[@]}" install -y clang lld
      - name: Canonical TEA parser and runtime ELF reader
        run: python3 tools/test_native_tea_769_host.py --output build/native-tea-69
      - name: StyleFS scoped TEA source and refusal (GCC and Clang)
        run: |
          set -euo pipefail
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -DSTYLEFS_HOST_FORMAT -fsanitize=address,undefined -fno-pie -no-pie -Iinclude tests/test_native_tea_stylefs.c kernel/{native_tea_stylefs,native_tea_package,native_tea_elf,stylefs_paged_object64,stylefs_paged_stream64,stylefs_paged_pair64,stylefs_inode_root64,stylefs_inode_pages64,stylefs_namespace64,stylefs_dircommit64,stylefs_directory64,stylefs_alloc64,stylefs_map64,stylefs_extent64,block_service}.c -o "build/native-tea-69/$cc-stylefs-tea"
            "build/native-tea-69/$cc-stylefs-tea" build/native-tea-69/minimal.tea build/native-tea-69/manifest-exact.json | tee "build/native-tea-69/$cc-stylefs-tea.log"
          done
      - name: Distinct reproducible ordinary TEA executables
        run: python3 tools/test_native_sample_69.py --output build/native-tea-69/samples
      - name: Window capability refusal and lifecycle tests
        run: python3 tools/test_native_window_channel.py --output build/window-channel-69
      - name: Runtime boundary recognizes valid pointer events and rejects malformed records
        run: |
          set -euo pipefail
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -ffunction-sections -fdata-sections -Wl,--gc-sections -Iinclude tests/test_runtime_bootstrap_863.c kernel/{runtime_entry_858,desktop_process_runtime,process_scheduler,process_runtime,window_service,user_session_runtime,native_window_channel}.c -o "build/forced-stop/boundary-$cc"
            "build/forced-stop/boundary-$cc" owned
            "build/forced-stop/boundary-$cc" ordinary
          done
      - name: Focus routing, clipped hit testing and capture
        run: python3 tools/test_native_desktop_bridge.py --output build/native-focus-69
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-forced-stop-host
          path: |
            build/forced-stop/
            build/window-channel-69/
            build/native-focus-69/
            build/native-tea-69/
  hang-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install actual guest tools
        run: |
          set -euo pipefail
          # These guest tools are Ubuntu packages. Do not depend on unrelated
          # third-party repositories preinstalled on hosted runners.
          test -r /etc/apt/sources.list.d/ubuntu.sources
          opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          sudo apt-get "${opts[@]}" update
          sudo apt-get "${opts[@]}" install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Verify QEMU 8.2.2
        run: qemu-system-x86_64 --version | head -n1 | grep '^QEMU emulator version 8\.2\.2 '
      - name: Existing hang coexistence regression (not forced stop)
        run: python3 tools/test_desktop_storage_service_863.py --tasks --mixed --four --iso --provisioned --integrated --owned-shell --native-catalog --native-hang --output build/native-hang
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-forced-stop-hang-regression
          path: build/native-hang/
          if-no-files-found: warn
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact tracked source
        run: |
          set -euo pipefail
          mkdir -p build/source
          git archive --format=tar --prefix="StyleOS-$GITHUB_SHA/" "$GITHUB_SHA" | gzip -n > "build/source/StyleOS-$GITHUB_SHA.tar.gz"
          git rev-parse HEAD HEAD^{tree} > build/source/git-identities.txt
          (cd build/source && sha256sum -- *.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: styleos-source-${{ github.sha }}
          path: build/source/
          if-no-files-found: error
  forced-stop-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install real guest tools
        run: |
          set -euo pipefail
          # These guest tools are Ubuntu packages. Do not depend on unrelated
          # third-party repositories preinstalled on hosted runners.
          test -r /etc/apt/sources.list.d/ubuntu.sources
          opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          sudo apt-get "${opts[@]}" update
          sudo apt-get "${opts[@]}" install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Check verifier syntax and exact QEMU version
        run: |
          python3 -m py_compile tools/native_forced_stop_verify.py tools/native_catalog_865_verify.py tools/test_desktop_storage_service_863.py
          qemu-system-x86_64 --version | head -n1 | grep '^QEMU emulator version 8\.2\.2 '
      - name: Actual CPL3 retained window frame, refusals, input and lifecycle
        run: python3 tools/test_desktop_storage_service_863.py --tasks --mixed --four --iso --provisioned --integrated --owned-shell --native-catalog --native-forced-stop --native-shell-boundary --native-window-ipc --native-window-tile --native-window-input --native-window-focus --native-window-frame --output build/native-forced-stop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-forced-stop-guest
          path: build/native-forced-stop/
          if-no-files-found: warn

  ordinary-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install guest tools
        run: |
          set -euo pipefail
          # These guest tools are Ubuntu packages. Do not depend on unrelated
          # third-party repositories preinstalled on hosted runners.
          test -r /etc/apt/sources.list.d/ubuntu.sources
          opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          sudo apt-get "${opts[@]}" update
          sudo apt-get "${opts[@]}" install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Ordinary ISO without diagnostic catalog
        run: python3 tools/test_desktop_storage_service_863.py --tasks --mixed --four --iso --provisioned --integrated --owned-shell --extended-desktop --output build/ordinary-shell
      - name: Deep Drop between real CPL3 clients on the same ordinary ISO
        run: python3 tools/test_deep_drop_guest.py --build build/ordinary-shell/build/x86_64 --output build/deep-drop-guest
      - name: Package the verified boot ISO
        run: |
          mkdir -p build/verified-iso
          cp build/ordinary-shell/build/x86_64/StyleOS-owned-shell-865.iso build/verified-iso/StyleOS-Deep-Drop-72.iso
          cd build/verified-iso && sha256sum *.iso > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: styleos-deep-drop-72-iso
          path: build/verified-iso/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-deep-drop-72-guest
          path: |
            build/deep-drop-guest/*.log
            build/deep-drop-guest/*.json
            build/deep-drop-guest/*.ppm
            build/deep-drop-guest/Deep-Drop-clients.raw
            build/ordinary-shell/build/x86_64/Drop-*.tea
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-ordinary-shell
          path: build/ordinary-shell/
          if-no-files-found: warn

  stylefs-live-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install guest tools
        run: |
          set -euo pipefail
          opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          sudo apt-get "${opts[@]}" update
          sudo apt-get "${opts[@]}" install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Build and verify existing live StyleFS volume
        run: python3 tools/test_stylefs_live_volume_39.py --output build/tea-stylefs-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-tea-stylefs-live
          # Never archive the 4 TiB sparse guest fixture on a failed run.
          # Preserve ISO, bounded provision data, UART, QMP and JSON evidence.
          path: |
            build/tea-stylefs-live/
            !build/tea-stylefs-live/*.raw
            !build/tea-stylefs-live/**/*.raw
          if-no-files-found: warn

  waiting-stop-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install guest tools
        run: |
          set -euo pipefail
          opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          sudo apt-get "${opts[@]}" update
          sudo apt-get "${opts[@]}" install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Isolated waiting process UI stop
        run: python3 tools/test_stylefs_live_volume_39.py --waiting-stop-only --output build/tea-waiting-stop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-tea-waiting-stop
          path: |
            build/tea-waiting-stop/
            !build/tea-waiting-stop/*.raw
            !build/tea-waiting-stop/**/*.raw
          if-no-files-found: warn

  fault-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        probe: [divide, execute-nx, single-step, forbidden-int]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install guest tools
        run: |
          set -euo pipefail
          opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          sudo apt-get "${opts[@]}" update
          sudo apt-get "${opts[@]}" install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Verify exact QEMU version
        run: qemu-system-x86_64 --version | head -n1 | grep '^QEMU emulator version 8\.2\.2 '
      - name: NX trace parser positive and negative contract
        run: python3 tools/test_native_nx_trace.py
      - name: Real CPL3 fault isolation and retirement
        run: python3 tools/test_desktop_storage_service_863.py --tasks --mixed --four --iso --provisioned --integrated --owned-shell --native-catalog --native-fault-probe ${{ matrix.probe }} --output build/fault-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-fault-70-${{ matrix.probe }}
          path: build/fault-probe/
          if-no-files-found: warn
