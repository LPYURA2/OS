name: StyleOS native infinite loop coexistence
on:
  push:
    branches: [feature/styleos-kernel-hang-containment]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hang-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install actual guest tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 qemu-utils ovmf dosfstools mtools xorriso
      - name: Verify exact QEMU version
        run: qemu-system-x86_64 --version | head -n1 | grep '^QEMU emulator version 8\.2\.2 '
      - name: Infinite valid user loop and 31 independent peers plus shell input
        run: python3 tools/test_desktop_storage_service_863.py --tasks --mixed --four --iso --provisioned --integrated --owned-shell --native-catalog --native-hang --output build/native-hang
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-native-hang-evidence
          path: build/native-hang/
          if-no-files-found: warn
