name: StyleOS independent Explorer package 123
on:
  push:
    branches: [feature/styleos-explorer-123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explorer-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build independent package and controller tests
        run: |
          set -euo pipefail
          python3 tools/build_explorer_123.py --output build/explorer-123
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-pie -no-pie -Isdk/native/include tests/test_explorer_app_123.c sdk/native/graphics.c -o "build/explorer-123/test-$cc"
            "build/explorer-123/test-$cc"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Explorer-123
          path: |
            build/explorer-123/Explorer.tea
            build/explorer-123/Explorer.elf
            build/explorer-123/explorer.svg
            build/explorer-123/manifest.json
