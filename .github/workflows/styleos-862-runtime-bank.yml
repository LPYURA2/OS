name: StyleOS 862 registry-only context bank guest
on:
  push:
    branches: [feature/styleos-runtime-select-862]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install QEMU and OVMF build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld dosfstools mtools xorriso qemu-system-x86 qemu-utils ovmf
      - name: Actual CPL3 LAPIC FP with registry-only process lifecycle
        run: python3 tools/test_runtime_bank_862_guest.py --output build/s862-bank-guest
      - name: Independently replay original guest CPU trace and UART
        run: python3 tools/test_runtime_bank_862_replay.py build/s862-bank-guest
      - name: Preserve raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: styleos-862-registry-bank-guest
          path: build/s862-bank-guest/
          if-no-files-found: warn
