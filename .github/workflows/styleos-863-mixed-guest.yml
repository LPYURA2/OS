name: StyleOS 863 mixed real syscalls and LAPIC dispatch
on:
  push:
    branches: [feature/styleos-desktop-runtime-863]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mixed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install real guest tools
        run: sudo apt-get update && sudo apt-get install -y clang lld qemu-system-x86 ovmf dosfstools mtools
      - name: Two returning INT80, eight LAPIC ticks, two terminal traps
        run: python3 tools/test_runtime_mixed_863_guest.py --output build/s863-mixed
      - name: Independent replay of original mixed CPU and UART capture
        run: python3 tools/test_runtime_mixed_863_replay.py build/s863-mixed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: styleos-863-mixed-guest
          path: build/s863-mixed/
          if-no-files-found: warn
