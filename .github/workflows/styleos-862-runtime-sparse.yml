name: StyleOS 862 delayed registry admission guest
on:
  push:
    branches: [feature/styleos-runtime-select-862]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install QEMU and OVMF build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld dosfstools mtools xorriso qemu-system-x86 qemu-utils ovmf
      - name: Actual CPL3 with delayed admission and safe release
        run: python3 tools/test_runtime_sparse_862_guest.py --output build/s862-sparse-guest
      - name: Independently replay original delayed-admission evidence
        run: python3 tools/test_runtime_sparse_862_replay.py build/s862-sparse-guest
      - name: Preserve raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: styleos-862-sparse-guest
          path: build/s862-sparse-guest/
          if-no-files-found: warn
