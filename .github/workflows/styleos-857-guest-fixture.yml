name: StyleOS 857 same-boot disk fixture observation
on:
  push:
    branches: [feature/styleos-storage-read-857]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install QEMU and OVMF build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld dosfstools mtools xorriso qemu-system-x86 qemu-utils ovmf
      - name: Compile scripts and rerun S856 topology model
        run: |
          python3 -m py_compile tools/guest_fixture_857.py tools/test_guest_fixture_boot_857.py
          python3 tools/test_storage_topology_856_verify.py
      - name: Observe PIIX3 and disposable disk across actual guest boot
        run: python3 tools/test_guest_fixture_boot_857.py --output build/s857-guest-fixture
      - name: Observe real BMIDE status under owned root (read only)
        run: |
          python3 tools/test_bmdma_boot_857.py --output build/s857-bmdma
          python3 tools/test_bmdma_857_verify.py build/s857-bmdma
      - name: Preserve raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: styleos-857-guest-fixture
          path: |
            build/s857-guest-fixture/
            build/s857-bmdma/
          if-no-files-found: warn
