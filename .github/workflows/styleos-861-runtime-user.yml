name: StyleOS 861 cooperative CPL3 on shared Desktop runtime
on:
  push:
    branches: [feature/styleos-runtime-join-861, feature/styleos-runtime-select-862, feature/styleos-desktop-runtime-863]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install QEMU and OVMF build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld dosfstools mtools xorriso qemu-system-x86 qemu-utils ovmf
      - name: Real cooperative CPL3, existing dispatcher, protected roots and original Desktop frame
        run: python3 tools/test_runtime_user_861_guest.py --output build/s861-user
      - name: Replay actual CPL3 evidence and reject mutated bindings
        run: python3 tools/test_runtime_user_861_replay.py build/s861-user
      - name: Preserve original guest evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: styleos-861-user-guest
          path: build/s861-user/
          if-no-files-found: warn
