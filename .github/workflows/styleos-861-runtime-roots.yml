name: StyleOS 861 Desktop and child-root supervisor roundtrips
on:
  push:
    branches: [feature/styleos-runtime-join-861]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install QEMU and OVMF build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld dosfstools mtools xorriso qemu-system-x86 qemu-utils ovmf
      - name: Real supervisor roundtrips on Desktop root and CPU trace
        run: python3 tools/test_runtime_roots_861_guest.py --output build/s861-roots
      - name: Independently replay and mutate original hardware evidence
        run: python3 tools/test_runtime_roots_861_replay.py build/s861-roots
      - name: Preserve original guest evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: styleos-861-root-guest
          path: build/s861-roots/
          if-no-files-found: warn
