name: StyleOS 860 real CPL3 timer and dispatcher integration
on:
  push:
    branches: [feature/styleos-runtime-tick-860]
  workflow_dispatch:
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Existing registry dispatcher and desktop service regressions
        run: |
          python3 tools/test_process_runtime.py --output build/s860/registry
          python3 tools/test_process_scheduler.py --output build/s860/scheduler
          python3 tools/test_desktop_process_runtime.py --output build/s860/desktop
      - name: Tick contract on GCC and Clang
        run: |
          set -euo pipefail
          mkdir -p build/s860
          for cc in gcc clang; do
            "$cc" -std=c11 -O1 -g -Wall -Wextra -Werror -DSTYLEOS_TEST_RUNTIME_TICK_860 -fsanitize=address,undefined -fno-pie -no-pie -Iinclude kernel/{process_runtime,process_scheduler,desktop_process_runtime,window_service,process_api,process_inspector,process_view,runtime_tick_860}.c tests/test_runtime_tick_860.c -o "build/s860/$cc"
            "build/s860/$cc" | tee "build/s860/$cc.log"
          done
      - name: Freestanding x86-64 COFF contract objects
        run: |
          set -euo pipefail
          for name in process_runtime process_scheduler runtime_tick_860; do
            clang --target=x86_64-pc-windows-msvc -std=c11 -O2 -ffreestanding -fno-builtin -fno-stack-protector -Wall -Wextra -Werror -mno-red-zone -mno-sse -mno-mmx -msoft-float -DSTYLEOS_TEST_RUNTIME_TICK_860 -Iinclude -c "kernel/$name.c" -o "build/s860/$name.obj"
            objdump -t "build/s860/$name.obj" > "build/s860/$name-symbols.log"
            if grep -q __chkstk "build/s860/$name-symbols.log"; then exit 1; fi
          done
      - name: Install real QEMU and image tools
        run: sudo apt-get update && sudo apt-get install -y clang lld dosfstools mtools xorriso qemu-system-x86 qemu-utils ovmf
      - name: Real CPL3 timer events through existing dispatcher and FP bank
        run: |
          set -euo pipefail
          python3 tools/test_runtime_tick_860_guest.py --output build/s860/guest
          python3 tools/test_runtime_tick_860_verify.py build/s860/guest/serial.log
          python3 tools/test_runtime_tick_860_trace.py build/s860/guest/serial.log build/s860/guest/cpu-trace.log.gz
      - name: Preserve model and actual guest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: styleos-860-tick-guest
          path: |
            build/s860/**/*.log
            build/s860/*.obj
            build/s860/guest/
          if-no-files-found: warn
